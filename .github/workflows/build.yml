# Compile l'application sur un poste Windows de GitHub et fournit l'exe à télécharger
# (onglet Actions → dernier passage → Artifacts). Aucun Visual Studio nécessaire.
name: Compilation

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests du cœur (structure, export .txt, sauvegarde, imports)
        run: dotnet run --project tests/RetoucheInventaire.Core.Tests -c Release
      - name: Tests du cœur iPad (même export .txt que Windows, octet pour octet)
        run: |
          dotnet build tests/RetoucheInventaire.Core.Tests -c Release -v q
          tests/RetoucheInventaire.Core.Tests/bin/Release/net10.0/RetoucheInventaire.Core.Tests export-file /tmp/windows.txt page1 page2 page5
          tests/RetoucheInventaire.Core.Tests/bin/Release/net10.0/RetoucheInventaire.Core.Tests export-file /tmp/windows-lots.txt --lots page1 page2 page5
          tests/RetoucheInventaire.Core.Tests/bin/Release/net10.0/RetoucheInventaire.Core.Tests export-frame /tmp/windows-colonne.pgm page1 page2 page5
          mkdir -p /tmp/windows-zero && tests/RetoucheInventaire.Core.Tests/bin/Release/net10.0/RetoucheInventaire.Core.Tests export-zero /tmp/windows-zero
          node web/tests/test.mjs /tmp/windows.txt /tmp/windows-lots.txt /tmp/windows-colonne.pgm /tmp/windows-zero

  # Version iPad : application web publiée sur GitHub Pages (branche gh-pages).
  site:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publication de la version iPad
        run: |
          rm -rf /tmp/site && cp -r web /tmp/site && rm -rf /tmp/site/tests /tmp/site/package.json
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" /tmp/site/sw.js
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Version iPad ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  application:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64      # Surface Intel / AMD
            platform: x64
          - rid: win-arm64    # Surface Snapdragon (ARM)
            platform: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publication autonome (sans installation sur la tablette)
        run: dotnet publish src/RetoucheInventaire.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.rid }}
      - name: Vérification du contenu (interface compilée présente)
        shell: pwsh
        run: |
          $d = "publish/${{ matrix.rid }}"
          Get-ChildItem $d -Filter *.pri | ForEach-Object { $_.Name }
          if (-not (Test-Path "$d/RetoucheInventaire.pri") -and -not (Test-Path "$d/resources.pri")) { Write-Error "Fichier .pri de l'application absent"; exit 1 }
      - name: Essai de lancement (x64)
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process "publish/win-x64/RetoucheInventaire.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "L'application s'est fermée (code $($p.ExitCode))"; Get-WinEvent -LogName Application -MaxEvents 15 | Where-Object { $_.ProviderName -match '.NET Runtime|Application Error' } | Format-List TimeCreated,Message; exit 1 }
          Write-Host "Application toujours ouverte après 20 s : OK"
          Stop-Process -Id $p.Id -Force
      - name: Ajout de l'installeur (raccourcis Bureau et menu Démarrer)
        run: Copy-Item installer\* publish\${{ matrix.rid }}\
      - uses: actions/upload-artifact@v4
        with:
          name: RetoucheInventaire-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  # Publie l'application prête à installer : lien direct, sans passer par l'onglet Actions.
  publication:
    needs: [tests, application]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Création de la version téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dl
          for d in RetoucheInventaire-win-*; do (cd "$d" && zip -qr "../$d.zip" .); done
          gh release delete derniere-version --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create derniere-version RetoucheInventaire-win-*.zip -R "$GITHUB_REPOSITORY" \
            --title "Retouche d'inventaire — dernière version" --latest \
            --notes "Télécharger le zip qui correspond à la Surface (x64 ou arm64), le débloquer, l'extraire, puis double-cliquer sur Installer.cmd."
